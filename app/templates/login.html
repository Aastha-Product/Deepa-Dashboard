<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Freshroots Demand Planning</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fa;font:14px/1.5 'Segoe UI',system-ui,Arial,sans-serif;color:#1c2a4a;padding:16px}
.box{background:#fff;border:1px solid #dde3ee;border-radius:10px;padding:28px;max-width:380px;width:100%}
h1{font-size:19px;margin:0 0 4px} p{color:#5a6b8c;margin:0 0 16px}
input{width:100%;box-sizing:border-box;font:inherit;border:1px solid #c9d1e2;border-radius:6px;padding:8px 10px;margin-bottom:12px}
button{width:100%;border:0;background:#2f6fd6;color:#fff;border-radius:6px;padding:9px;font:inherit;font-weight:600;cursor:pointer}
.msg{padding:10px;border-radius:6px;margin-bottom:12px;font-weight:600}.ok{background:#e3f4ea;color:#1e6b41}.err{background:#fde4e1;color:#8a1f12}
</style></head>
<body><div class="box">
  <h1>Freshroots · Demand Planning</h1>
  <p>Sign in with your work email. We'll email you a sign-in link.</p>
  {% if message %}<div class="msg {{ kind }}">{{ message }}</div>{% endif %}
  <div id="signing" class="msg ok" hidden>Signing you in…</div>
  <form id="form" method="post" action="/login"><input type="email" name="email" placeholder="you@freshroots.in" required autofocus aria-label="Email"><button type="submit">Email me a sign-in link</button></form>
  <script>
    // Sign-in and invite links return the session in the URL fragment, which the server never sees.
    // Supabase may land on /, /login or /auth/callback (the fragment survives the redirect), so check here.
    const p = new URLSearchParams(location.hash.slice(1));
    const fail = msg => { history.replaceState(null, '', '/login'); location.replace('/login?error=' + encodeURIComponent(msg)); };
    if (p.get('access_token')) {
      document.getElementById('form').hidden = true; document.getElementById('signing').hidden = false;
      fetch('/auth/session', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({access_token: p.get('access_token')})})
        .then(r => r.ok ? location.replace('/') : r.json().then(j => fail(j.detail || 'Sign-in failed')))
        .catch(() => fail('Sign-in failed'));
    } else if (p.get('error_description')) {
      fail(p.get('error_description'));
    } else if ({{ 'true' if script else 'false' }}) { location.replace('/login'); }
  </script>
</div></body></html>
